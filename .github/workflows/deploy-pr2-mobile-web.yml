name: Deploy PR 2 mobile web MVP

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-pr2-mobile-web.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: onemanarmy-pr2-mobile-web-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6.3"
  GODOT_RELEASE: "4.6.3-stable"
  SOURCE_REF: "07ec5c4207b6425262f705a77cf691bb4740068e"
  TARGET_PR: "2"

jobs:
  build:
    name: Build touch-enabled Godot Web export
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout pinned PR 2 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Install Godot 4.6.3 and Web export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" /tmp/godot /tmp/godot-templates

          curl --fail --location --retry 5 --retry-delay 2 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BINARY="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_*linux.x86_64' -print -quit)"
          test -n "$GODOT_BINARY"
          install -m 0755 "$GODOT_BINARY" "$HOME/.local/bin/godot"

          curl --fail --location --retry 5 --retry-delay 2 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" \
            --output /tmp/export_templates.tpz
          unzip -q /tmp/export_templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/godot" --version
          test -s "$TEMPLATE_DIR/web_release.zip"

      - name: Build mobile Web package
        shell: bash
        env:
          GODOT_BIN: godot
        run: bash tools/mobile_web/build.sh

      - name: Upload diagnostic Web package
        uses: actions/upload-artifact@v4
        with:
          name: onemanarmy-mobile-web-${{ env.SOURCE_REF }}
          path: build/web
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Report deployment result to PR 2
    needs:
      - build
      - deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create or update PR deployment report
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          SOURCE_REF: ${{ env.SOURCE_REF }}
          TARGET_PR: ${{ env.TARGET_PR }}
        with:
          script: |
            const marker = '<!-- onemanarmy-pr2-mobile-web-deploy -->';
            const buildResult = process.env.BUILD_RESULT || 'unknown';
            const deployResult = process.env.DEPLOY_RESULT || 'unknown';
            const sourceRef = process.env.SOURCE_REF;
            const prNumber = Number(process.env.TARGET_PR);
            const fallbackUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/`;
            const pageUrl = process.env.PAGE_URL || fallbackUrl;
            const success = buildResult === 'success' && deployResult === 'success';
            const status = success ? '✅ 배포 성공' : '❌ 배포 실패';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## 모바일 터치 Web MVP 배포 결과',
              '',
              `**${status}**`,
              '',
              `- Web 빌드: \`${buildResult}\``,
              `- GitHub Pages 배포: \`${deployResult}\``,
              `- 고정 소스 커밋: \`${sourceRef}\``,
              `- 실행 주소: ${success ? `[${pageUrl}](${pageUrl})` : '배포 성공 후 활성화'}`,
              `- 실행 로그: [GitHub Actions run ${context.runId}](${runUrl})`,
              '',
              success
                ? '휴대폰은 가로 화면으로 돌린 뒤 버튼과 대화창을 터치해 진행하면 됩니다.'
                : '실행 로그의 실패 단계를 확인해 수정 후 다시 배포해야 합니다.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
