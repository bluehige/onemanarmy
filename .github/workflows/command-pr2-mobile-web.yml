name: Command PR 2 mobile web deployment

on:
  issue_comment:
    types:
      - created
      - edited

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  dispatch:
    name: Dispatch mobile Web deployment
    if: >-
      github.event.issue.pull_request != null &&
      github.event.issue.number == 2 &&
      contains(github.event.comment.body, '/deploy-mobile-web')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Acknowledge command and dispatch deployment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;
            const commandCommentId = context.payload.comment.id;
            const commandActor = context.payload.comment.user.login;
            const commandRunUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            await github.rest.reactions.createForIssueComment({
              owner,
              repo,
              comment_id: commandCommentId,
              content: 'rocket',
            });

            const marker = '<!-- onemanarmy-pr2-mobile-web-command -->';
            const body = [
              marker,
              '## 모바일 Web 배포 명령 접수',
              '',
              `- 요청자: @${commandActor}`,
              `- 명령 워크플로: [GitHub Actions run ${context.runId}](${commandRunUrl})`,
              '- 상태: `DEPLOYMENT_DISPATCHED`',
              '- 실제 빌드·GitHub Pages 결과는 별도의 **모바일 터치 Web MVP 배포 결과** 댓글로 갱신됩니다.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'deploy-pr2-mobile-web.yml',
              ref: 'main',
            });
