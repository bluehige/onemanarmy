name: Validate mobile web MVP

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.6.3"
  GODOT_RELEASE: "4.6.3-stable"

jobs:
  mobile-web-export:
    name: Build touch-enabled Web export
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4

      - name: Install Godot 4.6.3 and Web export template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" /tmp/godot /tmp/godot-templates

          curl --fail --location --retry 5 --retry-delay 2 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BINARY="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_*linux.x86_64' -print -quit)"
          test -n "$GODOT_BINARY"
          install -m 0755 "$GODOT_BINARY" "$HOME/.local/bin/godot"

          curl --fail --location --retry 5 --retry-delay 2 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" \
            --output /tmp/export_templates.tpz
          unzip -q /tmp/export_templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/godot" --version
          test -s "$TEMPLATE_DIR/web_release.zip"

      - name: Prepare isolated mobile Web configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          project_path = Path("project.godot")
          project = project_path.read_text(encoding="utf-8")
          replacements = {
              'config/features=PackedStringArray("4.6", "Forward Plus")':
                  'config/features=PackedStringArray("4.6", "GL Compatibility")',
              'window/size/viewport_width=1920': 'window/size/viewport_width=1280',
              'window/size/viewport_height=1080': 'window/size/viewport_height=720',
              'renderer/rendering_method="forward_plus"':
                  'renderer/rendering_method="gl_compatibility"\nrenderer/rendering_method.mobile="gl_compatibility"',
          }
          for old, new in replacements.items():
              if old not in project:
                  raise SystemExit(f"Expected project setting not found: {old}")
              project = project.replace(old, new, 1)

          input_devices = '''
          [input_devices]

          pointing/emulate_mouse_from_touch=true
          pointing/emulate_touch_from_mouse=false

          '''
          if "[input_devices]" not in project:
              project = project.replace("[rendering]\n", input_devices + "[rendering]\n", 1)
          project_path.write_text(project, encoding="utf-8")

          presets_path = Path("export_presets.cfg")
          presets = presets_path.read_text(encoding="utf-8").rstrip()
          if 'name="Web Mobile"' not in presets:
              presets += r'''

          [preset.1]

          name="Web Mobile"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features="web_mobile"
          export_filter="all_resources"
          include_filter=""
          exclude_filter="tests/*,reports/*,tools/*,docs/*,build/windows/*,build/web/*"
          export_path="build/web/index.html"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.1.options]

          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          variant/thread_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=true
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=true
          progressive_web_app/enabled=false
          progressive_web_app/ensure_cross_origin_isolation_headers=false
          progressive_web_app/offline_page=""
          progressive_web_app/display=1
          progressive_web_app/orientation=0
          progressive_web_app/icon_144x144=""
          progressive_web_app/icon_180x180=""
          progressive_web_app/icon_512x512=""
          progressive_web_app/background_color=Color(0.09, 0.08, 0.07, 1)
          '''
          presets_path.write_text(presets + "\n", encoding="utf-8")
          PY

          grep -q 'pointing/emulate_mouse_from_touch=true' project.godot
          grep -q 'window/size/viewport_width=1280' project.godot
          grep -q 'renderer/rendering_method="gl_compatibility"' project.godot

      - name: Import resources
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$GITHUB_WORKSPACE" --editor --quit \
            --rendering-method gl_compatibility --rendering-driver opengl3

      - name: Export Web Mobile release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/web
          mkdir -p build/web
          godot --headless --path "$GITHUB_WORKSPACE" \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            --export-release "Web Mobile" build/web/index.html

      - name: Add mobile touch shell and verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build/web/index.html")
          html = path.read_text(encoding="utf-8")
          style = '''
          <meta name="theme-color" content="#171513">
          <style>
            html, body, canvas {
              margin: 0;
              overflow: hidden;
              overscroll-behavior: none;
              touch-action: none !important;
              -webkit-user-select: none;
              user-select: none;
              -webkit-touch-callout: none;
            }
            #mobile-rotate-notice { display: none; }
            @media (orientation: portrait) and (max-width: 900px) {
              #mobile-rotate-notice {
                position: fixed;
                inset: 0;
                z-index: 2147483647;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 32px;
                box-sizing: border-box;
                background: #171513;
                color: #f1ebdd;
                text-align: center;
                font: 700 22px/1.6 system-ui, sans-serif;
              }
            }
          </style>
          '''
          body = '''
          <div id="mobile-rotate-notice">휴대폰을 가로로 돌려주세요</div>
          <script>
            document.addEventListener('contextmenu', (event) => event.preventDefault());
            document.addEventListener('touchmove', (event) => {
              if (event.target instanceof HTMLCanvasElement) event.preventDefault();
            }, { passive: false });
          </script>
          '''
          if "</head>" not in html or "<body" not in html:
              raise SystemExit("Unexpected Godot Web HTML shell")
          html = html.replace("</head>", style + "\n</head>", 1)
          body_end = html.find(">", html.find("<body"))
          html = html[:body_end + 1] + body + html[body_end + 1:]
          path.write_text(html, encoding="utf-8")
          Path("build/web/.nojekyll").write_text("", encoding="utf-8")
          PY

          test -s build/web/index.html
          test -n "$(find build/web -maxdepth 1 -type f -name '*.wasm' -size +0c -print -quit)"
          test -n "$(find build/web -maxdepth 1 -type f -name '*.pck' -size +0c -print -quit)"
          grep -q 'mobile-rotate-notice' build/web/index.html
          grep -q 'touch-action: none' build/web/index.html
          du -sh build/web
          find build/web -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload verified Web build
        uses: actions/upload-artifact@v4
        with:
          name: onemanarmy-mobile-web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 7
