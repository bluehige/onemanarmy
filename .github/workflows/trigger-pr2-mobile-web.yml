name: Trigger PR 2 mobile web deployment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-pr2-mobile-web.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Announce trigger run on PR 2
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- onemanarmy-pr2-mobile-web-trigger -->';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## 모바일 Web 배포 트리거',
              '',
              `- 트리거 상태: \`STARTED\``,
              `- 트리거 실행: [GitHub Actions run ${context.runId}](${runUrl})`,
              '- 본 빌드·Pages 배포 결과는 별도 자동 댓글로 갱신됩니다.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 2,
                body,
              });
            }

      - name: Dispatch pinned mobile Web deployment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pr2-mobile-web.yml',
              ref: 'main',
            });
